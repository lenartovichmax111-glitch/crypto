<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DigitalVault</title><link rel="stylesheet" href="css/style.css"></head><body><main><header><span class="logo">◈ DigitalVault</span><span class="sub">Захищені нотатки</span></header><section class="panel" id="auth"><h1>Твоє цифрове сховище</h1><p>Створи обліковий запис або увійди.</p><input id="username" placeholder="Логін" autocomplete="username"><input id="password" type="password" placeholder="Пароль (від 8 символів)" autocomplete="current-password"><div class="buttons"><button id="login">Увійти</button><button class="outline" id="register">Реєстрація</button></div></section><section class="panel" id="vault" hidden><div class="heading"><h1>Мої нотатки</h1><button class="outline" id="logout">Вийти</button></div><input id="title" placeholder="Назва нотатки"><textarea id="content" placeholder="Текст нотатки"></textarea><input id="key" type="password" placeholder="Пароль шифрування (не зберігається на сервері)"><button id="save">Зашифрувати й зберегти</button><h2>Збережені нотатки</h2><div id="notes"></div></section><p id="message" role="status"></p><footer>Демонстраційний навчальний проєкт • AES-GCM у браузері</footer></main><script type="module" src="js/main.js"></script></body></html>
